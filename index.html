<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Piddiii</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600&family=Parisienne&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#9e3157;color:#fff}
body{font-family:'Cormorant Garamond',serif;overflow-x:hidden}
.page{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 10%,rgba(255,255,255,.12),transparent 30%),linear-gradient(145deg,#7f2445,#b74468 52%,#8b2b4d)}
.page:before{content:"";position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px;mix-blend-mode:soft-light}
.flowers{position:absolute;right:-20px;bottom:-15px;width:250px;height:220px;opacity:.9}
.flower{position:absolute;width:65px;height:65px;border-radius:50%;background:radial-gradient(circle,#f4b7bd 0 18%,transparent 19%),repeating-conic-gradient(from 0deg,#f3a8b1 0 12deg,#ffd0d0 12deg 25deg);filter:drop-shadow(0 4px 5px rgba(0,0,0,.15))}
.f1{right:35px;bottom:80px}.f2{right:105px;bottom:35px;transform:scale(.8)}.f3{right:-8px;bottom:25px;transform:scale(1.05)}
.stem{position:absolute;width:5px;height:150px;background:#486f55;transform:rotate(20deg);right:95px;bottom:-10px;border-radius:10px}
.stem2{right:45px;transform:rotate(-12deg)}
header{position:relative;text-align:center;padding:28px 18px 0;z-index:2}
header .happy{font-family:'Playfair Display',serif;font-size:38px;line-height:.9}
header .birthday{font-family:Parisienne,cursive;font-size:67px;line-height:.9;margin-top:3px}
.screen{position:relative;z-index:2;min-height:calc(100vh - 145px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px 35px 100px;text-align:center}
.typed{font-size:42px;line-height:1.35;min-height:125px;text-shadow:0 2px 2px rgba(0,0,0,.15)}
.typed:before{content:"";display:inline-block;width:3px;height:85px;background:#fff;vertical-align:middle;margin-right:30px;opacity:.9}
.hero-img{width:min(70vw,280px);max-height:330px;object-fit:cover;border-radius:22px;filter:drop-shadow(0 12px 12px rgba(0,0,0,.18));margin-top:5px}
.btn{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.12);color:#fff;padding:13px 26px;border-radius:30px;font-size:17px;font-family:inherit;margin-top:18px;backdrop-filter:blur(5px)}
.dots{position:absolute;left:18px;bottom:48px;width:3px;height:62px;background:#fff;border-radius:5px;opacity:.9}
.heart{position:fixed;right:24px;bottom:95px;font-size:28px;z-index:4;animation:pulse 1.6s infinite}
.section{display:none;position:relative;z-index:3;min-height:100vh;padding:35px 22px 90px;text-align:center}
.section h2{font-family:'Playfair Display',serif;font-size:39px;line-height:1.05;margin:20px 0 15px}
.section p{font-size:22px;line-height:1.55}
.gallery{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px;padding:4px}
.gallery .memory{width:100%;aspect-ratio:1/1.2;object-fit:cover;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.center-video{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:43%;aspect-ratio:16/9;object-fit:cover;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.35);background:#000;z-index:2}
.letter{margin-top:28px;padding:25px;border:1px solid rgba(255,255,255,.35);border-radius:24px;background:rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.back{position:absolute;top:20px;left:20px;background:none;border:0;color:#fff;font-size:28px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
.confetti i{position:absolute;width:7px;height:12px;top:-20px;animation:fall 3.5s linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}
@keyframes pulse{50%{transform:scale(1.2)}}
@media(min-width:700px){.page{max-width:520px;margin:auto;box-shadow:0 0 50px #32101e}.screen{min-height:850px}}
</style>
</head>
<body>

<div class="page" id="home">
<header><div class="happy">Happy Birthday Piddiii</div><div class="birthday">💗</div></header>
<div class="screen">
  <div class="typed" id="typed"></div>
  <img class="hero-img" id="heroImg" src="images/hero.jpg" alt="Birthday photo">
  <button class="btn" onclick="openWish()">Chotuu surprise for my XS bestfriend 🥹✨</button>
</div>
<div class="flowers"><div class="stem"></div><div class="stem stem2"></div><div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div></div>
<div class="dots"></div><div class="heart">♡</div>
</div>

<section class="section" id="wish">
<button class="back" onclick="goBack()">←</button>
<h2>Forr thee bestessssttttttt frienddddd I have everrrr ❤️</h2>
<p>A little birthday surprise made for you.</p>

<div class="gallery">
  <img class="memory" src="images/photo1.jpg" alt="Memory 1">
  <img class="memory" src="images/photo2.jpg" alt="Memory 2">
  <img class="memory" src="images/photo3.jpg" alt="Memory 3">
  <img class="memory" src="images/photo4.jpg" alt="Memory 4">
  <video class="center-video" src="surprise.mp4" controls playsinline preload="metadata"></video>
</div>

<div class="letter"><p>Happy Birthday! I hope this year brings you lots of happiness, laughter and beautiful memories. You deserve the best. 🫶🏻</p></div>
<button class="btn" onclick="celebrate()">One more surprise 🎂</button>
</section>

<div class="confetti" id="confetti"></div>
<script>
const OPENING_LINES=['Hello,','Every birthday','is a little more special','because it is YOUR day ❤️'];
let i=0,el=document.getElementById('typed');
function showLine(){if(i<OPENING_LINES.length){el.innerHTML=OPENING_LINES[i];i++;setTimeout(showLine,1150)}}showLine();
function openWish(){document.getElementById('home').style.display='none';document.getElementById('wish').style.display='block';window.scrollTo(0,0);celebrate()}
function goBack(){document.getElementById('wish').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}
function celebrate(){let c=document.getElementById('confetti');c.innerHTML='';for(let j=0;j<35;j++){let x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=['#ffd166','#fff','#ff9fbd','#e9c46a'][j%4];x.style.animationDelay=Math.random()*1.5+'s';c.appendChild(x)}setTimeout(()=>c.innerHTML='',4000)}
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const music = document.getElementById('bgMusic');
  const surpriseBtn = document.querySelector('button');
  if (music && surpriseBtn) {
    surpriseBtn.addEventListener('click', () => {
      music.volume = 0.65;
      music.play().catch(() => {});
    });
  }
});
</script>
</body>
</html>
